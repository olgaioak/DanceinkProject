<div class="contact-actions" [class.contact-actions--compact]="compact">
  <a class="contact-actions__button" [href]="phoneHref">{{ 'FAQ.CALL' | translate }}</a>
  <a class="contact-actions__button" [href]="emailHref">{{ 'FAQ.EMAIL' | translate }}</a>
  <a class="contact-actions__button" [href]="instagramHref" target="_blank" rel="noopener noreferrer">{{ 'FAQ.INSTAGRAM' | translate }}</a>
</div>
