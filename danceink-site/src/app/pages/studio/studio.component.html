<ng-container *ngIf="studio$ | async as studio">
  <section class="studio-intro">
    <div class="studio-intro__content">
      <app-section-eyebrow>{{ 'STUDIO_PAGE.EYEBROW' | translate }}</app-section-eyebrow>
      <h1>{{ 'STUDIO_PAGE.OWNER_NAME' | translate }}</h1>
      <img class="studio-intro__mark" src="assets/images/branding/DanceInk-Compact-Logo-white.png" alt="" />
      <p>{{ 'STUDIO_PAGE.BIO' | translate }}</p>
      <p>{{ 'STUDIO_PAGE.CLASSES' | translate }}</p>
      <p>{{ 'STUDIO_PAGE.PILATES' | translate }}</p>
    </div>
    <div class="studio-intro__photo">
      <img [src]="studio.mainPhoto.src" [alt]="studio.mainPhoto.altKey | translate" />
    </div>
  </section>

  <section class="studio-photos">
    <img
      *ngFor="let photo of studio.studioPhotos"
      class="studio-photos__image"
      [src]="photo.src"
      [alt]="photo.altKey | translate"
      loading="lazy" />
  </section>
</ng-container>
