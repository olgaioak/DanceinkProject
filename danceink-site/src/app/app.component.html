<button
  *ngIf="isHomePage$ | async"
  type="button"
  class="funding-banner"
  [attr.aria-label]="'FUNDING.OPEN' | translate"
  (click)="openFundingDialog()">
  <img
    class="funding-banner__image"
    src="assets/images/antagonistikotitaframeEL.jpg"
    alt="Με τη συγχρηματοδότηση της Ευρωπαϊκής Ένωσης — ΕΣΠΑ 2021-2027, Πρόγραμμα Ανταγωνιστικότητα" />
</button>

<dialog #fundingDialog class="funding-dialog" aria-labelledby="funding-dialog-text" (click)="onFundingDialogClick($event)">
  <div class="funding-dialog__content">
    <button
      type="button"
      class="funding-dialog__close"
      [attr.aria-label]="'FUNDING.CLOSE' | translate"
      (click)="fundingDialog.close()">
      ✕
    </button>
    <p id="funding-dialog-text" class="funding-dialog__text">{{ 'FUNDING.TEXT' | translate }}</p>
  </div>
</dialog>

<app-header></app-header>

<main>
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<app-faq-widget></app-faq-widget>
